repos:
  # Ruff Linter & Formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # Gitleaks Credential & Secret Scanner (Fast & Pattern-Based)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Yelp Detect-Secrets (Entropy-Based Scanner)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  # Local Pytest Coverage Gate
  - repo: local
    hooks:
      - id: pytest-coverage-check
        name: Run Pytest with 100% Coverage Gate
        entry: .venv/bin/pytest --cov=. --cov-report=term-missing --cov-fail-under=100
        language: system
        pass_filenames: false
        always_run: true

  # Commit Message Linting
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Commit Message Linting
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
