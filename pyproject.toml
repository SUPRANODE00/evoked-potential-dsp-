[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = [
    "accessible_telemetry.py",
    "init_db.py",
    "mesh_daemon.py",
    "purge_and_cancel_grid.py",
    "real_server.py",
    "verify_telemetry.py"
]
