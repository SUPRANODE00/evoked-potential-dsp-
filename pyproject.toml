[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "RUF"]
ignore = ["N806"]  # Allow uppercase variable names in local function scopes for DSP formulas (e.g. Q factor)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
