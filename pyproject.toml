[tool.ruff]
# Target Python version
target-version = "py313"

# Set max line length to match standard PEP 8 conventions
line-length = 88

# Exclude common cache and environment directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Select rules: Pyflakes (F), pycodestyle (E, W), isort (I), and flake8-bugbear (B)
select = ["E", "F", "W", "I", "B"]

# Ignore specific nuisance rules if necessary (e.g., line length warnings handled by formatter)
ignore = []

# Allow fix for all enabled rules (when using --fix)
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
testpaths = ["tests"]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
testpaths = ["tests"]
