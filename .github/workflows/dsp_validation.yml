name: DSP Pipeline Validation
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy pytest
    - name: Run Pipeline Integrity and SNR Tests
      run: |
        pytest tests/
