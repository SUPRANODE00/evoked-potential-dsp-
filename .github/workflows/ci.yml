name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linter-and-tests:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run MyPy Type Checker
        run: mypy .

      - name: Run Pytest
        run: pytest

  build-and-test-wheel:
    name: Build & Test Wheel Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Package Artifacts
        run: python -m build

      - name: Check Metadata and Package Syntax
        run: twine check dist/*

      - name: Test Wheel Installation in Clean Environment
        run: |
          pip install dist/*.whl
          python -c "import core; print('Wheel installed and core imported successfully!')"
